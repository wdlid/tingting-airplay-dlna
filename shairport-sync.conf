general =
{
  name = "TingTing";
  // iPhone 音量滑块映射到软件衰减的范围(dB), 默认 60 太大
  volume_range_db = 40;
  drift_tolerance_in_seconds = 0.02;
  resync_threshold_in_seconds = 0.12;
  interpolation = "soxr";
};

alsa =
{
  // sp48 是内嵌 alsa.conf 里定义的设备: plug -> hw:1,0, 强制 48000Hz
  output_device = "sp48";
  output_format = "S16";
  output_rate = 44100;
  use_precision_timing = "no";
  period_size = 1024;
  buffer_size = 8192;
  use_mmap_if_available = "no";
};
